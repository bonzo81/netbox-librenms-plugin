site_name: NetBox librenms Plugin
site_url: https://bonzo81.github.io/netbox-librenms-plugin
repo_url: https://github.com/bonzo81/netbox-librenms-plugin
repo_name: /netbox-librenms-plugin
#strict: true
nav:
  - Home: README.md
  - Getting Started:
    - Overview: getting_started/overview.md
    - Feature Overview: getting_started/feature_overview.md
    - Initial Setup: getting_started/initial_setup.md
    - Suggested Workflow: getting_started/suggested_workflow.md
  - Device Import:
    - Overview: device_import/overview.md
    - Searching for Devices: device_import/searching_for_devices.md
    - Validation & Configuration: device_import/validation_and_configuration.md
    - Out-of-Band Management: device_import/oob_management.md
    - Background Jobs & Caching: device_import/background_jobs_and_caching.md
  - Device Sync:
    - Overview: device_sync/overview.md
    - Sync Tabs: device_sync/sync_tabs.md
    - Module Sync: device_sync/module_sync.md
    - Virtual Chassis: device_sync/virtual_chassis.md
  - Configuration:
    - Overview: configuration/overview.md
    - Import Settings: configuration/import_settings.md
    - Multi-Server Setup: configuration/multi_server_configuration.md
    - Mappings: configuration/mappings.md
    - Rules & Patterns: configuration/rules_and_patterns.md
    - Permissions & Access: configuration/permissions.md
    - Custom Field Setup: configuration/custom_field.md
  - Development:
    - Overview: development/README.md
    - Project Structure: development/structure.md
    - Views & Inheritance: development/views.md
    - Mixins: development/mixins.md
    - Templates: development/templates.md
    - Extension Points: development/extension_points.md
    - Testing: development/testing.md
  - Changelog: changelog.md
  - Contributing: contributing.md

theme:
  name: material
  language: en
  #logo: assets/logo.png
  palette:
    scheme: preference
    primary: indigo
    accent: indigo
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tabs.sticky
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: false
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - admonition
  - pymdownx.escapeall:
      hardbreak: true
      nbsp: true
  - toc:
      baselevel: 2
      permalink: true
  - meta
plugins:
  - include-markdown
  - search:
      lang: en
  - mkdocstrings:

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com//netbox-librenms-plugin
      name: Github
  # to enable disqus, uncomment the following and put your disqus id below
  # disqus: disqus_id
# uncomment the following and put your google tracking id below to enable GA
#google_analytics:
  #- UA-xxx
  #- auto
