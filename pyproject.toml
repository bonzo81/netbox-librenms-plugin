# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name =  "netbox-librenms-plugin"
version = "0.4.8"
authors = [
    {name = "Andy Norwood"},
]
description = "Netbox plugin to sync data between LibreNMS and Netbox."
readme = "README.md"

classifiers=[
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    "Programming Language :: Python :: 3 :: Only",
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

requires-python = ">=3.12.0"
dependencies = ["google-re2>=1.1.20251105"]

[project.urls]
"Homepage" = "https://github.com/bonzo81/netbox-librenms-plugin/"
"Bug Tracker" = "https://github.com/bonzo81/netbox-librenms-plugin/issues/"

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-include-markdown-plugin",
    "mkdocstrings[python]",
    "pymdown-extensions",
]

# New: Restrict package discovery to our plugin only
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_librenms_plugin*"]
exclude = ["site*", "netbox_librenms_plugin.tests*"]

[tool.setuptools.package-data]
netbox_librenms_plugin = ["templates/**"]
# Only the novelty manifest ships at runtime: the in-plugin "Capture data shape" view reads
# manifest.json (signatures only) to classify novelty. The full recordings are test fixtures — they
# grow with every contribution and are needed only by the test suite (run from a source checkout),
# so they are deliberately NOT bundled in the wheel.
"netbox_librenms_plugin.data_shapes" = ["recordings/manifest.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox_librenms_plugin.tests.isolated_settings"
pythonpath = ["/opt/netbox/netbox"]
testpaths = ["netbox_librenms_plugin/tests"]
# Setting this replaces pytest's built-in defaults, so they are re-listed here.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "netbox_librenms_plugin/tests/browser",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=netbox_librenms_plugin --cov-report=term-missing"

[tool.ruff]
line-length = 120
# force-exclude so excluded paths are skipped even when passed explicitly (e.g. by the ruff
# pre-commit hook). Keeps the opengrep rule-test fixtures, which deliberately contain
# rule-violating code, out of ruff's scope.
force-exclude = true
# Python only (skip Ruff Markdown formatting).
extend-exclude = ["*.md", ".opengrep"]

[tool.ruff.lint]
# Explicit defaults; stable across Ruff versions.
select = [
    "E4", "E7", "E9", "F", "C901", "D",
    # Bug and accident guards. Each was at zero violations when adopted, apart from the
    # handful fixed alongside this change, so they prevent a pattern rather than clean one up.
    "A",      # a builtin shadowed by a name
    "ASYNC",  # blocking calls in async code, of which this plugin has none yet
    "B",      # bugbear
    "COM818", # a trailing comma that silently makes a bare tuple
    "DJ",     # Django model and form conventions
    "DTZ",    # a naive datetime
    "ERA",    # commented-out code
    "EXE",    # shebang and executable bit disagreeing
    "FLY",    # a static string join
    "ICN",    # import naming conventions
    "PLE",    # pylint errors, which are defects rather than style
    "PTH",    # pathlib over os.path
    "Q",      # quote style
    "RUF100", # a noqa that no longer suppresses anything
    "SLOT",   # __slots__ on a subclass of an immutable type
    "T10",    # a forgotten breakpoint
    "TC",     # imports needed only for typing
    "YTT",    # sys.version misuse
]
# Follow NetBox conventions - ignore certain rules
ignore = [
    "E501",  # Line too long (strongly encouraged but not enforced)
    "F403",  # Undefined local with import star
    "F405",  # Undefined local with import star usage
    "D1",    # Missing docstring: 308 one-line/absent cases stay out of scope for now
    "D212",  # Summary on the first line: the repo puts it on the second (D213)
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Allow re-exports in __init__.py files
"__init__.py" = ["F401"]
# The suite's convention is a single one-line summary, not Google sections.
"**/tests/**" = ["D"]
