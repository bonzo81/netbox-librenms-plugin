name: Test with all supported NetBox versions

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  test-netbox:
    runs-on: ubuntu-latest
    name: NetBox ${{ matrix.netbox-ref }} / Python ${{ matrix.python-version }}
    # main is unreleased; report but don't gate.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      # one red version shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          # Floor: min_version = 4.4.0 (gating regression guard).
          - netbox-ref: "v4.4.0"
            python-version: "3.12"
            experimental: false
          # Current stable (gating).
          - netbox-ref: "v4.6.5"
            python-version: "3.12"
            experimental: false
          - netbox-ref: "v4.6.5"
            python-version: "3.13"
            experimental: false
          # Unreleased NetBox — non-gating.
          - netbox-ref: "main"
            python-version: "3.13"
            experimental: true
          - netbox-ref: "main"
            python-version: "3.14"
            experimental: true

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

      postgres:
        image: postgres
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: netbox-librenms-plugin
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout NetBox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "netbox-community/netbox"
          path: netbox
          ref: ${{ matrix.netbox-ref }}
          persist-credentials: false

      - name: Install NetBox LibreNMS Plugin
        working-directory: netbox-librenms-plugin
        run: |
          pip install -e .
          pip install -r requirements_dev.txt

      - name: Set up configuration
        working-directory: netbox
        run: |
          ln -s "$(pwd)/../netbox-librenms-plugin/media/configuration.testing.py" netbox/netbox/configuration.py

          python -m pip install --upgrade pip
          python -m pip install tblib
          pip install -r requirements.txt -U

      - name: Run tests
        working-directory: netbox-librenms-plugin
        env:
          NETBOX_CONFIGURATION: netbox.configuration
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox
          TEST_DB_NAME: test_netbox_librenms_ci
          TEST_REDIS_HOST: localhost
        # -n auto: hosted runners have far fewer cores than MAX_PARALLEL_WORKERS, and one worker
        # per core beats oversubscribing them with eight test databases to migrate.
        run: >-
          pytest -n auto --maxschedchunk=1 --disable-warnings
          --ignore=netbox_librenms_plugin/tests/browser
          --cov-report=html:coverage_html -o pythonpath=../netbox/netbox

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Upload from exactly one job so the artifact name doesn't collide.
        if: matrix.netbox-ref == 'v4.6.5' && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: netbox-librenms-plugin/coverage_html/

  browser-tests:
    runs-on: ubuntu-latest
    name: Playwright browser state machine

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: netbox-librenms-plugin
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Playwright
        working-directory: netbox-librenms-plugin
        run: |
          pip install -r requirements_dev.txt
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: netbox-librenms-plugin
        run: >-
          pytest -c netbox_librenms_plugin/tests/browser/pytest.ini
          netbox_librenms_plugin/tests/browser

  e2e:
    runs-on: ubuntu-latest
    name: End-to-end / NetBox ${{ matrix.netbox }}
    # snapshot is unreleased NetBox; report but don't gate.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: min_version = 4.4.0.
          - netbox: "v4.4.0"
            experimental: false
          # Latest stable netbox-docker image.
          - netbox: "v4.7"
            experimental: false
          - netbox: "snapshot"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Playwright
        # --with-deps runs apt-get update, which fails on any broken source of the runner image.
        # Playwright downloads its own Chromium, so the Google Chrome source is not needed.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          uv run --system-certs --no-project --with-requirements tests/e2e/requirements.txt \
            playwright install --with-deps chromium

      - name: Build the plugin wheel
        run: uv build --system-certs --wheel

      - name: Start the end-to-end stack
        run: tests/e2e/setup.sh
        env:
          NETBOX_CONTAINER_TAG: ${{ matrix.netbox }}

      - name: Run end-to-end tests
        run: >-
          uv run --system-certs --no-project --with-requirements tests/e2e/requirements.txt
          pytest -c tests/e2e/pytest.ini tests/e2e -v

      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces-${{ matrix.netbox }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Show Docker logs
        if: ${{ always() }}
        run: docker compose logs
        working-directory: tests/e2e/docker
