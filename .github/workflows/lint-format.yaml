name: Lint and Format

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linting
        run: |
          echo "::group::Ruff Linting"
          ruff check . --output-format=github
          echo "::endgroup::"

      - name: Run Ruff formatting check
        run: |
          echo "::group::Ruff Formatting"
          ruff format --check .
          echo "::endgroup::"

      - name: Check for unhashable membership tests
        run: |
          echo "::group::Unhashable membership"
          python tools/lint_unhashable_membership.py netbox_librenms_plugin --github
          echo "::endgroup::"

      - name: Report formatting issues
        if: failure()
        run: |
          echo "::error::Formatting or linting issues detected!"
          echo "To fix locally, run:"
          echo "  ruff check --fix ."
          echo "  ruff format ."
          echo "Then commit and push the changes."
