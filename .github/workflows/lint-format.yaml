name: Lint and Format

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linting
        run: |
          echo "::group::Ruff Linting"
          ruff check . --output-format=github
          echo "::endgroup::"

      - name: Run Ruff formatting check
        run: |
          echo "::group::Ruff Formatting"
          ruff format --check .
          echo "::endgroup::"

      - name: Check for unhashable membership tests
        run: |
          echo "::group::Unhashable membership"
          python tools/lint_unhashable_membership.py netbox_librenms_plugin --github
          echo "::endgroup::"

      - name: Report formatting issues
        if: failure()
        run: |
          echo "::error::Formatting or linting issues detected!"
          echo "To fix locally, run:"
          echo "  ruff check --fix ."
          echo "  ruff format ."
          echo "Then commit and push the changes."

  opengrep:
    runs-on: ubuntu-latest
    name: Custom opengrep ruleset
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install opengrep
        env:
          OPENGREP_VERSION: v1.30.0
          OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
        run: |
          curl -fsSL -o /usr/local/bin/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /usr/local/bin/opengrep" | sha256sum -c -
          chmod +x /usr/local/bin/opengrep
          opengrep --version

      - name: Run opengrep rule-tests
        run: ./scripts/opengrep-test.sh

      - name: Run the custom ruleset over the package
        run: ./scripts/opengrep-scan.sh
