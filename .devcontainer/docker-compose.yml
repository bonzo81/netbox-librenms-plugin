services:
  devcontainer:
    image: netboxcommunity/netbox:${NETBOX_VERSION:-latest}
    volumes:
      - ../..:/workspaces:cached
      - netbox_media:/opt/netbox/netbox/media
      - netbox_static:/opt/netbox/netbox/static
      - gh_config:/root/.config/gh
    command: sleep infinity
    environment:
      NETBOX_VERSION: ${NETBOX_VERSION:-latest}
      DEBUG: ${DEBUG:-True}
      DEVELOPER: ${DEVELOPER:-True}
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-netbox}
      DB_USER: ${DB_USER:-netbox}
      DB_PASSWORD: ${DB_PASSWORD:-netbox}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-dummydummydummydummydummydummydummydummydummydummydummydummy}
      SUPERUSER_NAME: ${SUPERUSER_NAME:-admin}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@example.com}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-admin}
      SKIP_SUPERUSER: ${SKIP_SUPERUSER:-false}
      # Proxy settings (optional)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-},librenms-stub
      no_proxy: ${NO_PROXY:-},librenms-stub
      LIBRENMS_STUB_TOKEN: ${LIBRENMS_STUB_TOKEN:-dev-stub-token}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
      CURL_CA_BUNDLE: ${CURL_CA_BUNDLE:-}
      ALLOW_GIT_SSL_DISABLE: ${ALLOW_GIT_SSL_DISABLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      librenms-stub:
        condition: service_healthy
    ports:
      - "8000:8000"

  librenms-stub:
    image: python:3.13-alpine
    working_dir: /app
    environment:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    command:
      - python
      - netbox_librenms_plugin/tests/mock_librenms_server.py
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --token
      - ${LIBRENMS_STUB_TOKEN:-dev-stub-token}
    volumes:
      - ..:/app:ro
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-netbox}
      POSTGRES_USER: ${DB_USER:-netbox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-netbox}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  netbox_media:
  netbox_static:
  gh_config:
