repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4  # Use the latest version from https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The vendored htmx build must stay byte-identical to the upstream release.
      - id: trailing-whitespace
        exclude: ^netbox_librenms_plugin/tests/browser/vendor/
      - id: end-of-file-fixer
        exclude: ^netbox_librenms_plugin/tests/browser/vendor/
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: unhashable-membership
        name: unhashable membership check
        description: A set or dict membership test raises TypeError on an unhashable value.
        entry: python3 tools/lint_unhashable_membership.py netbox_librenms_plugin
        language: system
        pass_filenames: false
        files: ^netbox_librenms_plugin/.*\.py$
      # Runs at pre-push, not per commit: it needs the opengrep binary, which is not a pip
      # install. See .opengrep/README.md. CI runs the same scan.
      - id: import-disclosure
        name: import disclosure check (opengrep)
        description: A warning names a NetBox object that no permission scope filtered.
        entry: scripts/opengrep-scan.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^netbox_librenms_plugin/.*\.py$
