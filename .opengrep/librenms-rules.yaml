# Custom opengrep ruleset encoding this project's coding guidelines. These run ON TOP OF
# CodeRabbit's default opengrep packs: the file is intentionally NOT named opengrep.yml / semgrep.yml
# at the repo root, so CodeRabbit does NOT treat it as its config (which would replace its default
# ruleset). A CI step running opengrep ALSO makes CodeRabbit skip its own opengrep analysis, so
# there is deliberately no such step: the local pre-push hook enforces these rules, and
# CodeRabbit runs opengrep itself on the pull request.
#
# Rule-test fixtures live in .opengrep/tests/; run them with scripts/opengrep-test.sh.
#
# The scan needs --taint-intrafile: taint must cross into a module-private helper, which is where a
# per-function analysis loses the serial-match branch.
rules:
  - id: import-disclosure
    languages: [python]
    severity: ERROR
    message: >-
      This message names a NetBox object that no restrict() call filtered. The import preview
      searches NetBox without a permission scope on purpose: a duplicate the viewer cannot see is
      still a real conflict that must block the import. Identity is therefore withheld at display
      time by import_utils/disclosure.py, which can only do that if the identity travels as
      structured data. A name or pk baked into a warnings/issues string escapes that gate.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      references:
        - "netbox_librenms_plugin/import_utils/disclosure.py"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    mode: taint
    pattern-sources:
      # an unscoped manager chain
      - pattern: $M.objects
      # helpers that resolve a NetBox object with no permission scope applied
      - pattern: resolve_device_by_host_ip(...)
      - pattern: find_devices_by_serial(...)
      - pattern: find_by_librenms_id(...)
      - pattern: get_librenms_sync_device(...)
      # a match an unrestricted search already bound into the validation dict
      - pattern: $V["existing_device"]
    pattern-sanitizers:
      # Only ViewerScope may convert an unrestricted match into displayable identity. Bind the
      # sanitizer to its requesting user and the two disclosure actions. A restrict() call for a
      # different user, action, or code path does not authorize the current response.
      - patterns:
          - pattern-inside: |
              class ViewerScope:
                ...
          - pattern: $MODEL.objects.restrict(self._user, "view")
        exact: true
      - patterns:
          - pattern-inside: |
              class ViewerScope:
                ...
          - pattern: $MODEL.objects.restrict(self._user, "change")
        exact: true
      # Aggregates are exempted to keep real code workable, not because they provably erase
      # identity: a contrived len(range(owner.pk)) still carries the pk. sum() is NOT exempt,
      # because sum([owner.pk]) preserves it by accident rather than by contrivance.
      - pattern: $X.count()
        exact: true
      - pattern: $X.exists()
        exact: true
      - pattern: len(...)
        exact: true
      - pattern: all(...)
        exact: true
      - pattern: any(...)
        exact: true
      # This exact rendering may carry a visible match's LibreNMS linkage ID. Trust the value
      # transformation, not `_describe_link_note` as a callable name that another binding can use.
      - patterns:
          - pattern-inside: |
              def _describe_link_note(existing_link):
                ...
          - pattern: 'f"currently linked to LibreNMS device #{$ID}"'
        exact: true
    pattern-sinks:
      # the validation dict's message lists
      - pattern: $R["warnings"].append($MSG)
      - pattern: $R["issues"].append($MSG)
      - pattern: $R["warnings"].extend($MSG)
      - pattern: $R["issues"].extend($MSG)
      # whole-list assignment, not just append/extend
      - patterns:
          - pattern: $R["warnings"] = $MSG
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $R["issues"] = $MSG
          - focus-metavariable: $MSG
      # a local list alias appended to directly, before the function hands it back
      - patterns:
          - pattern: $L.append($MSG)
          - metavariable-regex:
              metavariable: $L
              regex: ^(.*_)?(warnings|issues)$
      # a local list of any name handed back under a warnings/issues key
      - patterns:
          - pattern-either:
              - pattern: '{..., "warnings": $MSG, ...}'
              - pattern: '{..., "issues": $MSG, ...}'
          - focus-metavariable: $MSG
      # the merge-candidate prose. host_named=/oob_named= carry pk and name as STRUCTURED data on
      # purpose: that is the sanctioned channel the display gate can withhold, so focus on the
      # message alone or the rule flags the very shape the fix prescribes.
      - patterns:
          - pattern: apply_merge_candidates(..., warning=$MSG, ...)
          - focus-metavariable: $MSG
  - id: import-disclosure-sanitizer-shadow
    languages: [python]
    severity: ERROR
    message: >-
      This binding shadows a disclosure-scoping API name. Rename it so an unrestricted lookup
      cannot impersonate a disclosure sanitizer or obscure a taint flow.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    pattern-either:
      - patterns:
          - pattern: |
              def $SANITIZER(...):
                ...
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: |
              async def $SANITIZER(...):
                ...
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: $SANITIZER = $VALUE
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: $RECEIVER.$SANITIZER = $VALUE
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: "$SANITIZER: $TYPE = $VALUE"
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: "$RECEIVER.$SANITIZER: $TYPE = $VALUE"
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: ($SANITIZER := $VALUE)
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: |
              def $FUNCTION(..., $SANITIZER, ...):
                ...
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - patterns:
          - pattern: |
              async def $FUNCTION(..., $SANITIZER, ...):
                ...
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: ^(restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)$
      - pattern-regex: >-
          \blambda\b[^\n:]*\b(?:restrict|restricted_queryset|restrict_object_or_404|_describe_link_note)\b[^\n:]*:
  - id: no-requests-outside-http-client
    languages: [python]
    severity: ERROR
    message: >-
      This call uses an imported requests HTTP API outside librenms_api.py. The package
      routes all HTTP through that shared client. This check covers selected requests calls
      with an import binding in this file; it does not track clients passed between functions.
    metadata:
      category: security
    paths:
      include: ["**/netbox_librenms_plugin/**"]
      exclude: ["**/netbox_librenms_plugin/librenms_api.py", "**/tests/**"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  import $REQUESTS
                  ...
              - metavariable-regex:
                  metavariable: $REQUESTS
                  regex: ^requests$
              - pattern: $REQUESTS.$METHOD(...)
          - patterns:
              - pattern-inside: |
                  import requests as $REQUESTS
                  ...
              - pattern: $REQUESTS.$METHOD(...)
          - patterns:
              - pattern-inside: |
                  from requests import $METHOD
                  ...
              - pattern: $METHOD(...)
          - patterns:
              - pattern-inside: |
                  from requests import $METHOD as $CALL
                  ...
              - pattern: $CALL(...)
          - patterns:
              - pattern-inside: |
                  from requests.api import $METHOD
                  ...
              - pattern: $METHOD(...)
          - patterns:
              - pattern-inside: |
                  import requests.sessions
                  ...
              - pattern: requests.sessions.$METHOD(...)
          - patterns:
              - pattern-inside: |
                  import requests.sessions as $SESSIONS
                  ...
              - pattern: $SESSIONS.$METHOD(...)
          - patterns:
              - pattern-inside: |
                  from requests import sessions
                  ...
              - pattern: sessions.$METHOD(...)
          - patterns:
              - pattern-inside: |
                  from requests import sessions as $SESSIONS
                  ...
              - pattern: $SESSIONS.$METHOD(...)
          - patterns:
              - pattern-inside: |
                  from requests.sessions import $METHOD
                  ...
              - pattern: $METHOD(...)
          - patterns:
              - pattern-inside: |
                  from requests.sessions import $METHOD as $CALL
                  ...
              - pattern: $CALL(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|head|options|post|put|patch|delete|request|Session|session)$
  - id: ipaddress-address-needs-netaddr
    languages: [python]
    severity: ERROR
    message: >-
      Give an ipam IPAddress its address as netaddr.IPNetwork(...), the type NetBox loads from
      the database. On NetBox 4.4, IPAddress.family (read by Device.clean()) raises on an
      in-memory str address. A ** expansion hides the address, so it is always reported. The
      assignment and setattr checks cover files that import IPAddress or ipam.models.
    metadata:
      category: correctness
    paths:
      include: ["**/netbox_librenms_plugin/**"]
      exclude: ["**/tests/**", "**/migrations/**"]
    pattern-either:
      - patterns:
          - pattern: ipam.models.IPAddress(..., address=$ADDRESS, ...)
          - pattern-not: ipam.models.IPAddress(..., address=netaddr.IPNetwork(...), ...)
      - pattern: ipam.models.IPAddress(..., **$VALUES, ...)
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: ipam.models.IPAddress.objects. ... .$CREATE(..., address=$ADDRESS, ...)
                  - pattern-not: ipam.models.IPAddress.objects. ... .$CREATE(..., address=netaddr.IPNetwork(...), ...)
              - pattern: ipam.models.IPAddress.objects. ... .$CREATE(..., **$VALUES, ...)
          - metavariable-regex:
              metavariable: $CREATE
              regex: ^(create|get_or_create|update_or_create)$
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: |
                      ipam.models.IPAddress.objects. ... .$CREATE(..., $DEFAULTS={..., "address": $ADDRESS, ...}, ...)
                  - pattern-not: |
                      ipam.models.IPAddress.objects. ... .$CREATE(..., $DEFAULTS={..., "address": netaddr.IPNetwork(...), ...}, ...)
              - pattern: |
                  ipam.models.IPAddress.objects. ... .$CREATE(..., $DEFAULTS={..., **$VALUES, ...}, ...)
          - metavariable-regex:
              metavariable: $CREATE
              regex: ^(get_or_create|update_or_create)$
          - metavariable-regex:
              metavariable: $DEFAULTS
              regex: ^(defaults|create_defaults)$
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from ipam.models import IPAddress
                  ...
              - patterns:
                  # Resolves `import ipam.models [as m]` and `from ipam import models [as m]` only.
                  - pattern-inside: |
                      from $PACKAGE import $MODULE
                      ...
                  - metavariable-regex:
                      metavariable: $PACKAGE
                      regex: ^ipam$
                  - metavariable-regex:
                      metavariable: $MODULE
                      regex: ^models$
          - pattern-either:
              - patterns:
                  - pattern: $IP.address = $ADDRESS
                  - pattern-not: $IP.address = netaddr.IPNetwork(...)
              - patterns:
                  - pattern: setattr($IP, "address", $ADDRESS)
                  - pattern-not: setattr($IP, "address", netaddr.IPNetwork(...))
  - id: url-numeric-pk-converter
    languages: [python]
    severity: ERROR
    message: >-
      This path() route uses <str:pk> or <pk>. By package convention, name numeric primary
      keys pk and use <int:pk>. This check covers literal routes and local string constants;
      it does not infer identifier types or inspect dynamically built routes.
    metadata:
      category: security
    patterns:
      - pattern-either:
          - pattern: path($ROUTE, ...)
          - pattern: django.urls.path($ROUTE, ...)
          - pattern: path(..., route=$ROUTE, ...)
          - pattern: django.urls.path(..., route=$ROUTE, ...)
      - metavariable-comparison:
          metavariable: $ROUTE
          comparison: re.match(".*<(str:)?pk>", $ROUTE)
  - id: no-direct-htmx-request-header-read
    languages: [python]
    severity: ERROR
    message: >-
      This code reads the HX-Request header directly. Use request.htmx from django-htmx, whose
      middleware NetBox installs: it is true only when the header is "true". A direct read can
      treat "HX-Request: false" as an htmx request, and two reads can disagree.
    metadata:
      category: correctness
    paths:
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: $HEADERS.get($KEY, ...)
          - pattern: $HEADERS[$KEY]
          - pattern: $KEY in $HEADERS
          - pattern: $KEY not in $HEADERS
      - metavariable-pattern:
          metavariable: $KEY
          patterns:
            - pattern-either:
                - pattern: '"=~/(?i)^hx-request$/"'
                - pattern: '"=~/(?i)^http_hx_request$/"'
  - id: no-django-testcase-in-tests
    languages: [python]
    severity: WARNING
    message: >-
      This check detects direct Django TestCase imports or inheritance, not dynamic bases.
      Use a plain pytest class and mark database tests with pytest.mark.django_db.
    metadata:
      category: maintainability
    paths:
      include: ["**/netbox_librenms_plugin/tests/**"]
    pattern-either:
      - pattern: from django.test import TestCase
      - pattern: from django.test.testcases import TestCase
      - pattern: |
          class $CLASS(..., django.test.TestCase, ...):
            ...
      - pattern: |
          class $CLASS(..., django.test.testcases.TestCase, ...):
            ...
  - id: no-unittest-assertions
    languages: [python]
    severity: WARNING
    message: >-
      This test calls a self method with a unittest assertion API name. Use assert,
      pytest.raises, pytest.warns or caplog as appropriate. This name check does not resolve
      the method implementation; custom helpers with other names are allowed.
    metadata:
      category: maintainability
    paths:
      include: ["**/netbox_librenms_plugin/tests/**"]
    patterns:
      - pattern: self.$ASSERT(...)
      - metavariable-regex:
          metavariable: $ASSERT
          regex: >-
            (?x)^assert(?:
              AlmostEqual|CountEqual|DictEqual|Equal|False|
              Greater|GreaterEqual|In|Is|IsInstance|
              IsNone|IsNot|IsNotNone|Less|LessEqual|
              ListEqual|Logs|MultiLineEqual|NoLogs|NotAlmostEqual|
              NotEqual|NotIn|NotIsInstance|NotRegex|Raises|
              RaisesRegex|Regex|SequenceEqual|SetEqual|True|
              TupleEqual|Warns|WarnsRegex|Equals|NotEquals|
              AlmostEquals|NotAlmostEquals|RegexpMatches|NotRegexpMatches|RaisesRegexp|
              StartsWith|NotStartsWith|EndsWith|NotEndsWith|HasAttr|
              NotHasAttr|IsSubclass|NotIsSubclass
            )$
  - id: xfail-needs-raises
    languages: [python]
    severity: ERROR
    message: >-
      Give pytest.mark.xfail the exception that the recorded defect raises, with raises=. Without
      it, any error satisfies the marker, so a test whose setup fails looks like the defect.
    metadata:
      category: correctness
    paths:
      include: ["**/netbox_librenms_plugin/tests/**"]
    pattern-either:
      - patterns:
          - pattern: pytest.mark.xfail(...)
          - pattern-not: pytest.mark.xfail(..., raises=$EXCEPTION, ...)
      - pattern: pytest.mark.xfail(..., raises=None, ...)
      - pattern: pytest.mark.xfail.with_args(..., raises=None, ...)
      # A bare marker, but not an alias assignment; the use of an alias is not followed.
      - patterns:
          - pattern: pytest.mark.xfail
          - pattern-not-inside: pytest.mark.xfail(...)
          - pattern-not-inside: pytest.mark.xfail.with_args(..., raises=$EXCEPTION, ...)
          - pattern-not-inside: $ALIAS = pytest.mark.xfail
      - pattern: pytestmark = pytest.mark.xfail
  - id: no-selected-fuzzy-apis
    languages: [python]
    severity: WARNING
    message: >-
      This call uses a selected API for approximate selection: difflib close matches or similarity
      ratios, or a fuzzywuzzy/rapidfuzz fuzz scorer. Use exact lookups for sites, platforms,
      device types and roles. This check detects selected APIs, not the exact-only invariant.
      It follows direct constructors and propagated local bindings; intervening method calls
      can hide a matcher. It cannot identify custom similarity functions or dynamic scorers.
    metadata:
      category: correctness
    options:
      symbolic_propagation: true
    pattern-either:
      - pattern: difflib.get_close_matches(...)
      - patterns:
          - pattern: difflib.SequenceMatcher(...).$RATIO(...)
          - metavariable-regex:
              metavariable: $RATIO
              regex: ^(ratio|quick_ratio|real_quick_ratio)$
      - patterns:
          - pattern-either:
              - pattern: fuzzywuzzy.fuzz.$SCORER(...)
              - pattern: rapidfuzz.fuzz.$SCORER(...)
          - metavariable-regex:
              metavariable: $SCORER
              regex: >-
                (?x)^(ratio|partial_ratio|partial_ratio_alignment|token_sort_ratio|token_set_ratio|
                partial_token_sort_ratio|partial_token_set_ratio|token_ratio|partial_token_ratio|
                WRatio|QRatio|UWRatio|UQRatio)$
  - id: caught-error-text
    languages: [python]
    severity: ERROR
    message: >-
      This code reads a caught error that can be a ValidationError, a database error or an
      AbortRequest. NetBox's clean() messages and admin validators can name objects outside the
      viewer's scope, and PostgreSQL's error text can hold key values. Give the error to
      exception_text_for, log it through the module logger, or raise it. Every other read is a
      finding, also the call of a helper. A reviewed exception gets a nosemgrep comment with a reason.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      references:
        - "netbox_librenms_plugin/utils.py"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    mode: taint
    options:
      taint_assume_safe_comparisons: true
    pattern-sources:
      # The name that a handler binds, when its class can catch a risky error or is a base class of one.
      # A try statement with an else or a finally clause needs its own shape.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
                  else:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
                  finally:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
                  else:
                    ...
                  finally:
                    ...
          - metavariable-pattern:
              metavariable: $CLASSES
              pattern-either:
                # Keep these classes in step with the same list in caught-error-text-shadow.
                - pattern: django.core.exceptions.ValidationError
                - pattern: django.forms.ValidationError
                - pattern: utilities.exceptions.AbortRequest
                - pattern: builtins.ExceptionGroup
                - pattern: builtins.BaseExceptionGroup
                - pattern: django.db.models.ProtectedError
                - pattern: django.db.models.RestrictedError
                - pattern: django.db.models.deletion.ProtectedError
                - pattern: django.db.models.deletion.RestrictedError
                - pattern: psycopg.errors.$MEMBER
                # A class of a module that holds errors; the case keeps out a submodule such as models.
                - patterns:
                    - pattern-either:
                        - pattern: django.db.$MEMBER
                        - pattern: django.db.utils.$MEMBER
                        - pattern: django.db.transaction.$MEMBER
                        - pattern: psycopg.$MEMBER
                    - metavariable-regex:
                        metavariable: $MEMBER
                        regex: ^[A-Z][a-z]
                - pattern-regex: >-
                    \b(ValidationError|Error|DatabaseError|DataError|IntegrityError|InterfaceError|InternalError|NotSupportedError|OperationalError|ProgrammingError|TransactionManagementError|ProtectedError|RestrictedError|AbortRequest|ExceptionGroup|BaseExceptionGroup|CableSyncTagNameTaken)\b
                # The base classes of every risky class.
                - pattern: Exception
                - pattern: BaseException
                - pattern: builtins.Exception
                - pattern: builtins.BaseException
                # A class that the rule cannot name, such as type(exc) or a subscript.
                - pattern: $FUNCTION(...)
                - pattern: $VALUE[$INDEX]
          # A slice drops taint in opengrep, so a slice of the name or of its attributes is a source too.
          - pattern-either:
              - pattern: $ERROR
              - pattern: <... $ERROR ...>[$LOW:$HIGH]
              - pattern: <... $ERROR ...>[:$HIGH]
              - pattern: <... $ERROR ...>[$LOW:]
              - pattern: <... $ERROR ...>[:]
              - pattern: <... $ERROR ...>[::$STEP]
              - pattern: <... $ERROR ...>[$LOW::$STEP]
              - pattern: <... $ERROR ...>[:$HIGH:$STEP]
              - pattern: <... $ERROR ...>[$LOW:$HIGH:$STEP]
      # The name of any handler, read outside its try statement in the same function: in a closure
      # or a lambda that the function defines before the handler.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $OUTER(...):
                    ...
                    try:
                      ...
                    except $CLASSES as $ERROR:
                      ...
              - pattern-inside: |
                  def $OUTER(...):
                    ...
                    try:
                      ...
                    except $CLASSES as $ERROR:
                      ...
                    else:
                      ...
              - pattern-inside: |
                  def $OUTER(...):
                    ...
                    try:
                      ...
                    except $CLASSES as $ERROR:
                      ...
                    finally:
                      ...
              - pattern-inside: |
                  def $OUTER(...):
                    ...
                    try:
                      ...
                    except $CLASSES as $ERROR:
                      ...
                    else:
                      ...
                    finally:
                      ...
          - pattern-not-inside: |
              try:
                ...
              except $CLASSES as $ERROR:
                ...
          - pattern-not-inside: |
              try:
                ...
              except $CLASSES as $ERROR:
                ...
              else:
                ...
          - pattern-not-inside: |
              try:
                ...
              except $CLASSES as $ERROR:
                ...
              finally:
                ...
          - pattern-not-inside: |
              try:
                ...
              except $CLASSES as $ERROR:
                ...
              else:
                ...
              finally:
                ...
          - pattern-either:
              - pattern: $ERROR
              - pattern: <... $ERROR ...>[$LOW:$HIGH]
              - pattern: <... $ERROR ...>[:$HIGH]
              - pattern: <... $ERROR ...>[$LOW:]
              - pattern: <... $ERROR ...>[:]
              - pattern: <... $ERROR ...>[::$STEP]
              - pattern: <... $ERROR ...>[$LOW::$STEP]
              - pattern: <... $ERROR ...>[:$HIGH:$STEP]
              - pattern: <... $ERROR ...>[$LOW:$HIGH:$STEP]
      # An error that another error chains, in any function, or the errors that a group holds.
      - pattern-either:
          - pattern: $CHAINED.__cause__
          - pattern: $CHAINED.__context__
          - pattern: getattr($CHAINED, "__cause__", ...)
          - pattern: getattr($CHAINED, "__context__", ...)
        exact: true
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $GROUP:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $GROUP:
                    ...
                  else:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $GROUP:
                    ...
                  finally:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $GROUP:
                    ...
                  else:
                    ...
                  finally:
                    ...
          - pattern-either:
              - pattern: $GROUP.exceptions
              - pattern: getattr($GROUP, "exceptions", ...)
        exact: true
      # A call that returns the current exception, or a frame or namespace that holds it.
      - pattern-either:
          - pattern: sys.exc_info(...)
          - pattern: sys.exception(...)
          - pattern: sys._getframe(...)
          - pattern: sys._current_frames(...)
          - pattern: traceback.format_exc(...)
          - pattern: traceback.format_exception(...)
          - pattern: traceback.format_exception_only(...)
          - pattern: traceback.format_tb(...)
          - pattern: traceback.print_exc(...)
          - pattern: traceback.print_exception(...)
          - pattern: traceback.walk_stack(...)
          - pattern: traceback.walk_tb(...)
          - pattern: traceback.StackSummary.$METHOD(...)
          - pattern: traceback.StackSummary(...)
          - pattern: traceback.TracebackException.$METHOD(...)
          - pattern: traceback.TracebackException(...)
          - pattern: inspect.currentframe(...)
          - pattern: inspect.stack(...)
          - pattern: inspect.trace(...)
          - pattern: inspect.getouterframes(...)
          - pattern: inspect.getinnerframes(...)
          - pattern: locals(...)
          - pattern: eval(...)
          - pattern: exec(...)
          - pattern: vars()
        exact: true
    pattern-sanitizers:
      # The rule itself, and checks that return no error text. Each one must get the error itself.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: exception_text_for($ERROR, ...)
                  - pattern-not: exception_text_for(..., exc=$OTHER, ...)
              - pattern: exception_text_for(..., exc=$ERROR, ...)
              - pattern: classify_conflict($ERROR)
              - pattern: database_error_sqlstate($ERROR)
              - pattern: isinstance($ERROR, $TYPES)
              - pattern: hasattr($ERROR, $ATTRIBUTE)
              - pattern: type($ERROR)
          - metavariable-regex:
              metavariable: $ERROR
              regex: ^\w+(\.__(cause|context)__)*$
        exact: true
      # Only in the reviewed factory: TypeRefusal.text_for applies the superuser rule to the message.
      # Each call of the factory is still a finding at the call.
      - patterns:
          - pattern-inside: |
              def _first_refusal(...):
                ...
          - pattern: TypeRefusal(...)
        exact: true
      - pattern: $VALUE is None
        exact: true
      - pattern: $VALUE is not None
        exact: true
    pattern-sinks:
      # An argument or a receiver of a call, other than the module logger and the calls above. The
      # focus reports the call itself, also a call of a helper that intrafile analysis follows.
      - patterns:
          - pattern-either:
              - pattern: $CALL(..., $OPERAND, ...)
              - pattern: $CALL(..., $KEYWORD=$OPERAND, ...)
              - pattern: $OPERAND.$METHOD(...)
          - pattern-not: logger.debug(...)
          - pattern-not: logger.info(...)
          - pattern-not: logger.warning(...)
          - pattern-not: logger.error(...)
          - pattern-not: logger.exception(...)
          - pattern-not: logger.critical(...)
          - pattern-not: logger.log(...)
          - pattern-not: exception_text_for(...)
          - pattern-not: classify_conflict($ERROR)
          - pattern-not: database_error_sqlstate($ERROR)
          - pattern-not: isinstance($ERROR, $TYPES)
          - pattern-not: hasattr($ERROR, $ATTRIBUTE)
          - pattern-not: type($ERROR)
          # A store, a return or a call that gets its result is still a finding.
          - pattern-not: validation_error_detail(...)
          - focus-metavariable: $OPERAND
        exact: true
      # A value that holds the error and leaves the expression: a store, a return, a yield or a loop.
      - patterns:
          - pattern-either:
              - pattern: $TARGET = $VALUE
              - pattern: "$TARGET: $TYPE = $VALUE"
              - pattern: $TARGET += $VALUE
              - pattern: $TARGET -= $VALUE
              - pattern: $TARGET *= $VALUE
              - pattern: $TARGET /= $VALUE
              - pattern: $TARGET //= $VALUE
              - pattern: $TARGET %= $VALUE
              - pattern: $TARGET **= $VALUE
              - pattern: $TARGET |= $VALUE
              - pattern: $TARGET &= $VALUE
              - pattern: $TARGET ^= $VALUE
              - pattern: $TARGET <<= $VALUE
              - pattern: $TARGET >>= $VALUE
              - pattern: $TARGET @= $VALUE
              - pattern: ($TARGET := $VALUE)
              - pattern: return $VALUE
              - pattern: yield $VALUE
              - pattern: yield from $VALUE
              - pattern: |
                  for $TARGET in $VALUE:
                    ...
              - pattern: assert $CHECK, $VALUE
          - focus-metavariable: $VALUE
        exact: true
      # A reader that writes the current exception into a file-like object, such as a response.
      - pattern-either:
          - pattern: traceback.print_exc(..., file=$FILE, ...)
          - pattern: traceback.print_exception(..., file=$FILE, ...)
          - pattern: traceback.print_tb(..., file=$FILE, ...)
        exact: true
  - id: caught-error-text-shadow
    languages: [python]
    severity: ERROR
    message: >-
      This code hides a caught error or a trusted name from caught-error-text. That rule trusts
      exception_text_for, classify_conflict, database_error_sqlstate, validation_error_detail,
      _first_refusal, TypeRefusal, isinstance, hasattr, type and the module logger by name, and it knows a risky error class by
      its name. Do not bind those names again, change the logging setup, keep a risky class under
      another name, or use except*, which opengrep cannot parse. In a try statement with a named
      handler, do not use a lambda default (use functools.partial), a decorator or a match
      statement, and nowhere give a lambda a default that calls a function: taint analysis does
      not read them. Add a new subclass of a risky class to the
      source classes of caught-error-text, then give its definition a nosemgrep comment.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    pattern-either:
      # A binding of a name that caught-error-text trusts.
      - patterns:
          - pattern-either:
              - pattern: |
                  def $NAME(...):
                    ...
              - pattern: |
                  async def $NAME(...):
                    ...
              - pattern: |
                  class $NAME:
                    ...
              - pattern: |
                  def $FUNCTION(..., $NAME, ...):
                    ...
              - pattern: |
                  async def $FUNCTION(..., $NAME, ...):
                    ...
              - pattern: "$NAME: $TYPE = $VALUE"
              - pattern: setattr($OWNER, "$NAME", ...)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|logger)$
      # An assignment to a trusted name, also as one target of several.
      - patterns:
          - pattern: $TARGETS = $VALUE
          - metavariable-regex:
              metavariable: $TARGETS
              regex: (?:^|[\s,(\[*])(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|logger)(?:[\s,)\]]|$)
          - pattern-not: logger = logging.getLogger(__name__)
      # A loop or comprehension target, an as or case target, or a walrus. A target holds only names,
      # dots, commas, brackets and stars; it spans lines only in brackets, so prose rarely matches.
      - pattern-regex: >-
          \bfor[ \t]+(?:(?!\bin\b)[\w \t,()\[\]*.])*?\b(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|isinstance|hasattr|type|logger)\b(?:(?!\bin\b)[\w \t,()\[\]*.])*?[ \t]+in\b
      - pattern-regex: >-
          \bfor[ \t]*[(\[](?:(?!\bin\b)[\w\s,()\[\]*.])*?\b(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|isinstance|hasattr|type|logger)\b(?:(?!\bin\b)[\w\s,()\[\]*.])*?[)\]][ \t]*in\b
      - pattern-regex: \bas\s+\(?(?:[\w\s,]*,\s*)?(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|isinstance|hasattr|type|logger)\b
      - pattern-regex: (?m)^[ \t]*case\b[^\n]*\b(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|isinstance|hasattr|type|logger)\b
      - pattern-regex: >-
          \bcase[ \t]*[(\[](?:[\w\s,()\[\]*.|])*?\b(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|isinstance|hasattr|type|logger)\b
      - pattern-regex: \b(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|isinstance|hasattr|type|logger)\s*:=
      # A trusted builtin that a function, a parameter or an import binds again.
      - patterns:
          - pattern-either:
              - pattern: |
                  def $NAME(...):
                    ...
              - pattern: |
                  def $FUNCTION(..., $NAME, ...):
                    ...
              - pattern: |
                  async def $FUNCTION(..., $NAME, ...):
                    ...
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(isinstance|hasattr|type)$
      # A trusted builtin that a module-level assignment binds.
      - patterns:
          - pattern: $TARGETS = $VALUE
          - pattern-not-inside: |
              class $CLASS:
                ...
          - pattern-not-inside: |
              def $FUNCTION(...):
                ...
          - metavariable-regex:
              metavariable: $TARGETS
              regex: (?:^|[\s,(\[*])(?:isinstance|hasattr|type)(?:[\s,)\]]|$)
      # A trusted builtin that an assignment in a function binds; a class attribute does not shadow it.
      - patterns:
          - pattern-inside: |
              def $FUNCTION(...):
                ...
          - pattern: $TARGETS = $VALUE
          - metavariable-regex:
              metavariable: $TARGETS
              regex: (?:^|[\s,(\[*])(?:isinstance|hasattr|type)(?:[\s,)\]]|$)
      - pattern-regex: >-
          \blambda\b(?:[^:"'{]|"[^"\n]*"|'[^'\n]*'|\{[^{}]*\})*\b(?:exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|isinstance|hasattr|type|logger)\b(?:[^:"'{]|"[^"\n]*"|'[^'\n]*'|\{[^{}]*\})*:
      # A lambda default that calls a function, anywhere: taint analysis does not read it.
      - pattern-regex: \blambda\b(?:[^:"'{]|"[^"\n]*"|'[^'\n]*'|\{[^{}]*\})*=(?:[^:"'{]|"[^"\n]*"|'[^'\n]*'|\{[^{}]*\})*(?:\(|\{[^{}]*\()
      # A lambda default, a decorator or a match statement in a try statement with a named handler:
      # taint analysis does not read them.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
                  else:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
                  finally:
                    ...
              - pattern-inside: |
                  try:
                    ...
                  except $CLASSES as $ERROR:
                    ...
                  else:
                    ...
                  finally:
                    ...
          - pattern-either:
              - pattern-regex: \blambda\b[^:]*=
              - pattern-regex: (?m)^[ \t]*@
              - pattern-regex: (?m)^[ \t]*match[ \t]+[^=\s]
      # A trusted name from a module other than the package's own.
      - patterns:
          - pattern: from $MODULE import $NAME
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(exception_text_for|classify_conflict|database_error_sqlstate|validation_error_detail|_first_refusal|TypeRefusal|logger)$
          - metavariable-regex:
              metavariable: $MODULE
              regex: ^(?!(netbox_librenms_plugin\.|\.+)(utils|transactions|interface_diff)$)
      # A change to the module logger or to the logging setup: a handler can put a record on a page.
      - pattern: logger.$ATTRIBUTE = $VALUE
      - pattern: setattr(logger, ...)
      - pattern: $LOGGER.addHandler(...)
      - pattern: logging.setLoggerClass(...)
      - pattern: logging.setLogRecordFactory(...)
      - pattern: logging.basicConfig(...)
      - pattern: logging.config.dictConfig(...)
      - pattern: logging.config.fileConfig(...)
      - patterns:
          - pattern: |
              class $CLASS(..., $BASE, ...):
                ...
          - metavariable-pattern:
              metavariable: $BASE
              patterns:
                - pattern-either:
                    - pattern: logging.$KIND
                    - pattern: logging.handlers.$KIND
                - metavariable-regex:
                    metavariable: $KIND
                    regex: (Handler|Logger|LoggerAdapter)$
      # A risky class under another name, which caught-error-text cannot follow into an except clause.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $NAME = $CLASSES
                      - pattern: "$NAME: $TYPE = $CLASSES"
                  - metavariable-regex:
                      metavariable: $CLASSES
                      regex: ^(?:[\w.]+|\([\w.\s,*()]*\))$
              - pattern: |
                  class $NAME(..., $CLASSES, ...):
                    ...
          - metavariable-pattern:
              metavariable: $CLASSES
              pattern-either:
                # Keep these classes in step with the same list in caught-error-text.
                - pattern: django.core.exceptions.ValidationError
                - pattern: django.forms.ValidationError
                - pattern: utilities.exceptions.AbortRequest
                - pattern: builtins.ExceptionGroup
                - pattern: builtins.BaseExceptionGroup
                - pattern: django.db.models.ProtectedError
                - pattern: django.db.models.RestrictedError
                - pattern: django.db.models.deletion.ProtectedError
                - pattern: django.db.models.deletion.RestrictedError
                - pattern: psycopg.errors.$MEMBER
                # A class of a module that holds errors; the case keeps out a submodule such as models.
                - patterns:
                    - pattern-either:
                        - pattern: django.db.$MEMBER
                        - pattern: django.db.utils.$MEMBER
                        - pattern: django.db.transaction.$MEMBER
                        - pattern: psycopg.$MEMBER
                    - metavariable-regex:
                        metavariable: $MEMBER
                        regex: ^[A-Z][a-z]
                - pattern-regex: >-
                    \b(ValidationError|Error|DatabaseError|DataError|IntegrityError|InterfaceError|InternalError|NotSupportedError|OperationalError|ProgrammingError|TransactionManagementError|ProtectedError|RestrictedError|AbortRequest|ExceptionGroup|BaseExceptionGroup|CableSyncTagNameTaken)\b
      # An alias of a base class of every risky class.
      - patterns:
          - pattern-either:
              - pattern: $NAME = $CLASSES
              - pattern: "$NAME: $TYPE = $CLASSES"
          - metavariable-regex:
              metavariable: $CLASSES
              regex: ^(?:[\w.]+|\([\w.\s,*()]*\))$
          - metavariable-regex:
              metavariable: $CLASSES
              regex: \b(Base)?Exception\b
      - pattern-regex: (?m)^[ \t]*except[ \t]*\*
