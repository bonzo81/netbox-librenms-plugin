{# The checked state is the user's saved choice; data-default-checked is the factory default for the count badge and Reset. #}
<div class="dropdown" id="ip-sync-options"
    data-save-pref-url="{% url 'plugins:netbox_librenms_plugin:save_user_pref' %}">
    <button class="btn btn-outline-secondary dropdown-toggle" type="button"
            data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
        <i class="mdi mdi-tune-variant"></i> Sync options
        <span class="badge bg-secondary-lt ms-1" id="ip-sync-options-count">0</span>
    </button>
    <div class="dropdown-menu p-3 ip-sync-options-menu">
        <div class="form-check form-switch mb-2">
            <input type="hidden" name="set-primary-ip-toggle" value="off">
            <input class="form-check-input ip-sync-option" type="checkbox" id="set-primary-ip-toggle-cb"
                   name="set-primary-ip-toggle" value="on" {% if ip_sync.set_primary_ip %}checked{% endif %}
                   data-default-checked="false"
                   title="When the synced IP equals the device's LibreNMS management IP and is assigned to an interface, set it as the Primary IP.">
            <label class="form-check-label small" for="set-primary-ip-toggle-cb">Set Primary IP</label>
        </div>
        <div class="form-check form-switch mb-2">
            <input type="hidden" name="create-missing-interfaces-toggle" value="off">
            <input class="form-check-input ip-sync-option" type="checkbox" id="create-missing-interfaces-toggle-cb"
                   name="create-missing-interfaces-toggle" value="on" {% if ip_sync.create_missing_interfaces %}checked{% endif %}
                   data-default-checked="false"
                   title="Create a missing NetBox interface from the cached LibreNMS port before assigning the selected IP address.">
            <label class="form-check-label small" for="create-missing-interfaces-toggle-cb">Create missing interfaces</label>
        </div>
        <hr class="my-2">
        <button class="btn btn-link btn-sm p-0" type="button" id="reset-ip-sync-options">
            Reset to defaults
        </button>
    </div>
</div>
