{# The error summary above the form says what to correct; no row is shown for an invalid filter. #}
{# The table id and the selection scope let the browser drop the selections of the other scopes. #}
<div class="card-body text-center text-muted py-4" data-filter-invalid="true" data-selection-table="{{ table.attrs.id }}" data-selection-scope="{{ table.selection_scope }}">{{ text }}</div>
