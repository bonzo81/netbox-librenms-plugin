{% load librenms_sync_query %}
<div id="{{ cache_container_id }}" class="sync-cache-countdown">
    {% if cache_expiry %}
    {% sync_cache_timeout cache_server_key as cache_timeout %}
    <div id="{{ cache_countdown_id }}" class="sync-cache-bar" data-expiry="{{ cache_expiry|date:'c' }}"
         data-timeout="{{ cache_timeout }}" role="progressbar" aria-label="Cache time remaining"
         aria-valuemin="0" aria-valuemax="{{ cache_timeout }}" aria-valuenow="0" aria-valuetext="" title="">
        <span class="sync-cache-fill"></span>
        <span class="visually-hidden sync-cache-remaining"></span>
    </div>
    {% endif %}
</div>
