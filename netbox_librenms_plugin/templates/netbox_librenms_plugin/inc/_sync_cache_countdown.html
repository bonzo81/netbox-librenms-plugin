<span {% if cache_oob %}hx-swap-oob="innerHTML:#{{ cache_container_id }}"{% else %}id="{{ cache_container_id }}"
      class="text-secondary d-inline-flex align-items-center gap-1"{% endif %}>
    {% if cache_expiry %}
    <i class="mdi mdi-clock-outline"></i>
    <span>Cache expires in <span id="{{ cache_countdown_id }}" data-expiry="{{ cache_expiry|date:'c' }}"></span></span>
    {% endif %}
</span>
